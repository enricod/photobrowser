[package]
name = "photobrowser"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
async-channel = "2.5.0"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dirs = "7.0.0"
fast_image_resize = "6.1.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "jpeg"] }
lru = "0.18.5"
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"
turbojpeg = { version = "1.5.1", default-features = false, features = ["pkg-config"] }

[build-dependencies]
bindgen = "0.73.2"
pkg-config = "0.3.34"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "pipeline"
harness = false

[profile.dev.package."*"]
opt-level = 2          # decoders/resizers are unusably slow unoptimised

[profile.release]
lto = "thin"
codegen-units = 1
